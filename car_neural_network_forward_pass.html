<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Interactive neural network: move five distance sensors and watch the hidden layer and the steering and speed outputs change.</h2>
<div style="display:flex;flex-wrap:wrap;gap:16px;padding:0.5rem 0;">
  <div style="flex:0 0 200px;">
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
      <button data-p="0,0,0,0,0" style="font-size:12px;padding:4px 8px;">Clear road</button>
      <button data-p="0,0,10,70,90" style="font-size:12px;padding:4px 8px;">Car on right</button>
      <button data-p="0,35,90,35,0" style="font-size:12px;padding:4px 8px;">Car ahead</button>
      <button data-p="70,60,80,60,70" style="font-size:12px;padding:4px 8px;">Boxed in</button>
    </div>
    <div id="sl"></div>
    <svg viewBox="0 0 190 130" width="100%" role="img" aria-label="Top-down view of the car and its five sensor rays" style="margin-top:8px;background:var(--surface-1);border-radius:12px;">
      <g id="rays"></g>
      <rect x="82" y="92" width="26" height="34" rx="4" fill="#7F77DD"/>
      <rect x="87" y="98" width="16" height="7" rx="1" fill="#26215C"/>
    </svg>
  </div>
  <div style="flex:1 1 380px;min-width:300px;">
    <svg id="net" viewBox="0 0 460 300" width="100%" role="img" aria-label="Neural network with 5 inputs, 4 hidden neurons and 2 outputs"></svg>
    <div id="decision" style="font-size:14px;font-weight:500;text-align:center;margin-top:4px;"></div>
    <div style="font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px;">Blue lines push a neuron up, orange lines push it down. Brighter and thicker means more signal.</div>
  </div>
</div>
<script>
var names=['far left','left','front','right','far right'];
var W1=[[-0.2,-0.4,0.3,1.2,1.4],[1.4,1.2,0.3,-0.4,-0.2],[0,0.4,1.8,0.4,0],[0.6,0.6,0.6,0.6,0.6]];
var B1=[-0.5,-0.5,-0.6,-1.2];
var hn=['right blocked','left blocked','front blocked','crowded'];
var W2=[[-1.3,1.3,0.4,0],[-0.8,-0.8,-3.5,-2]];
var B2=[0,2.5];
var sl=document.getElementById('sl');
names.forEach(function(n,i){
  var d=document.createElement('div');
  d.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px;';
  d.innerHTML='<label style="font-size:12px;color:var(--text-secondary);width:52px;">'+n+'</label><input type="range" min="0" max="100" step="1" value="0" id="s'+i+'" style="flex:1;"><span id="v'+i+'" style="font-size:12px;width:28px;text-align:right;">0</span>';
  sl.appendChild(d);
});
function relu(z){return Math.max(0,z);}
function sig(z){return 1/(1+Math.exp(-z));}
function line(x1,y1,x2,y2,w,s){
  var c=w>=0?'#378ADD':'#D85A30';
  var op=Math.min(1,0.07+Math.abs(w*s)*0.9);
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(0.5+Math.min(3,Math.abs(w)*1.3)).toFixed(1)+'" stroke-opacity="'+op.toFixed(2)+'"/>';
}
function node(x,y,r,a,txt,col){
  var o=(0.1+0.9*Math.min(1,a)).toFixed(2);
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+col+'" fill-opacity="'+o+'" stroke="var(--border-strong)" stroke-width="1"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" style="font-size:11px;fill:var(--text-primary);font-family:var(--font-sans);">'+txt+'</text>';
}
function lab(x,y,t,anchor){
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||'middle')+'" style="font-size:11px;fill:var(--text-secondary);font-family:var(--font-sans);">'+t+'</text>';
}
function update(){
  var x=[];
  for(var i=0;i<5;i++){var v=+document.getElementById('s'+i).value/100;x.push(v);document.getElementById('v'+i).textContent=Math.round(v*100);}
  var h=W1.map(function(w,j){var z=B1[j];for(var i=0;i<5;i++)z+=w[i]*x[i];return relu(z);});
  var steer=Math.tanh(W2[0].reduce(function(a,w,j){return a+w*h[j];},B2[0]));
  var thr=sig(W2[1].reduce(function(a,w,j){return a+w*h[j];},B2[1]));
  var ix=50,hx=230,ox=400;
  var iy=[40,95,150,205,260],hy=[55,118,181,244],oy=[100,200];
  var s='';
  for(var j=0;j<4;j++)for(var i=0;i<5;i++)s+=line(ix,iy[i],hx,hy[j],W1[j][i],x[i]);
  for(var k=0;k<2;k++)for(var j2=0;j2<4;j2++)s+=line(hx,hy[j2],ox,oy[k],W2[k][j2],h[j2]);
  for(var i2=0;i2<5;i2++){s+=node(ix,iy[i2],17,x[i2],Math.round(x[i2]*100)/100,'#EF9F27');s+=lab(ix,iy[i2]-22,i2===0?'':'',1);}
  for(var j3=0;j3<4;j3++){s+=node(hx,hy[j3],17,h[j3],h[j3].toFixed(2),'#7F77DD');s+=lab(hx,hy[j3]+32,hn[j3]);}
  var side=steer<-0.03?'L ':(steer>0.03?'R ':'');
  s+=node(ox,oy[0],22,Math.abs(steer),side+Math.abs(steer).toFixed(2),'#1D9E75');
  s+=node(ox,oy[1],22,thr,thr.toFixed(2),'#1D9E75');
  s+=lab(ox,oy[0]-30,'steering');
  s+=lab(ox,oy[1]+38,'speed');
  s+=lab(ix,14,'inputs (sensors)');
  s+=lab(hx,14,'hidden layer');
  s+=lab(ox,14,'outputs');
  document.getElementById('net').innerHTML=s;
  var r='';
  var ang=[-60,-30,0,30,60];
  for(var q=0;q<5;q++){
    var a=ang[q]*Math.PI/180,L=8+80*(1-x[q]);
    var ex=95+Math.sin(a)*L,ey=92-Math.cos(a)*L;
    r+='<line x1="95" y1="92" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'" stroke="#EF9F27" stroke-width="2"/>';
    if(x[q]>0.05)r+='<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="4" fill="#E24B4A"/>';
  }
  document.getElementById('rays').innerHTML=r;
  var d1=Math.abs(steer)<0.15?'Holds its line':(steer<0?'Steers left':'Steers right');
  var d2=thr>0.8?'full speed':(thr>0.55?'eases off':'slows down');
  document.getElementById('decision').textContent=d1+', '+d2;
}
for(var i=0;i<5;i++)document.getElementById('s'+i).addEventListener('input',update);
document.querySelectorAll('button[data-p]').forEach(function(b){
  b.addEventListener('click',function(){
    var p=b.getAttribute('data-p').split(',');
    for(var i=0;i<5;i++)document.getElementById('s'+i).value=p[i];
    update();
  });
});
update();
</script>
